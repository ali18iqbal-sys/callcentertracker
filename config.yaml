# CallCenterTracker - Configuration

app:
  name: "CallCenterTracker"
  version: "0.1.0"
  environment: "development"

paths:
  raw: "data/raw"
  staging: "data/staging"
  master: "data/master"
  reports: "data/reports"

matching:
  unique_key: "phone"
  price_column: "price"
  skip_if_price:
    empty: true
    zero: true
    negative: true
  non_numeric_action: "popup"

columns:
  phone:
    - "phone"
    - "phone #"
    - "phone number"
    - "mobile"
    - "contact"
    - "phone no"
  price:
    - "price"
    - "rate"
    - "unit price"
  amount:
    - "amount"
    - "total"
    - "value"
    - "revenue"
    - "sale amount"
    - "sale revenue"
  revenue:
    - "revenue"
    - "sale revenue"
    - "sale amount"
  minutes:
    - "minutes"
    - "mins"
    - "min"
    - "duration"
  team:
    - "team"
    - "team name"
  dialer:
    - "dialer"
    - "dialer id"
    - "agent"
  date:
    - "date"
    - "call date"
    - "sale date"
  calls:
    - "calls"
    - "call count"
    - "count"

features:
  charts: false
  pdf_export: false
  email_scheduler: false
  whatsapp_alerts: false
  public_share_link: false
  auto_fetch_gsheet: false
  api_endpoint: false
  client_portal: false
  commission_calc: false
  multi_client: false

calculations:
  - name: "line_amount"
    column_a: "minutes"
    operation: "multiply"
    column_b: "price"
    enabled: true